<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pogoda</title>

        <link rel="manifest" href="./manifest.json">
        <meta name="theme-color" content="#134e51">
        <script src="https://kit.fontawesome.com/39f966edaf.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <header>
            <h1>Aplikacja pogodowa</h1>
        </header>

        <main>
            <div class="location">
                <p class="city_name"></p>
            </div>
            <div class="search">
                <div>
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="podaj nazwę miasta">
                </div>
                <p class="error-message"></p>
            </div>
            <div class="weather">
                <div class="weather-top"></div>
                    <p class="date"></p>
                    <div class="temp_info">
                        <p class="temp"></p>
                        <div>
                            <p class="description"></p>
                            <p class="feels_like"></p>
                        </div>
                    </div>
                </div>
            <div class="weather-bottom">
                <div class="weather-info">
                    <p>Prędkość wiatru</p>
                    <p class="wind-speed"></p>
                </div>
                <div class="weather-info">
                    <p>Ciśnienie</p>
                    <p class="pressure"></p>
                </div>
                <div class="weather-info">
                    <p>Wilgotność</p>
                    <p class="humidity"></p>
                </div>
                <div class="weather-info">
                    <p>Widoczność</p>
                    <p class="visibility"></p>
                </div>
                <div class="weather-info">
                    <p>Zachmurzenie</p>
                    <p class="clouds"></p>
                </div>
                <div class="weather-info">
                    <p>Opady</p>
                    <p class="rain"></p>
                </div>
            </div>
        </main>
        <footer>
            <p>Projekt UWSB Merito Gdynia 2026</p>
            <p>Autor: Eryk W</p>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="main.js"></script>
        <script src="./sw.js"></script>
    </body>
</html>
